name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      PUBLIC_SITE_URL: ${{ vars.PUBLIC_SITE_URL || 'https://streamvault.pages.dev' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type & content check
        run: npm run check

      - name: Build (Astro + Pagefind index + video sitemap)
        run: npm run build

      # Publish to Cloudflare Pages. Requires two repo secrets:
      #   CLOUDFLARE_API_TOKEN  (Pages:Edit permission)
      #   CLOUDFLARE_ACCOUNT_ID (your Cloudflare account ID)
      # and a Pages project named "streamvault" (see README).
      - name: Publish to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=streamvault
